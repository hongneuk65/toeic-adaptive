services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toeic}
      POSTGRES_USER: ${POSTGRES_USER:-toeic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-toeic}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-toeic}?schema=public
    # Tạo bảng, rồi nạp thư viện học thật nếu có prisma/public-library.json.gz (bản ZIP nộp kèm khóa luận),
    # nếu không thì nạp dữ liệu mẫu tổng hợp. Chỉ nạp khi cơ sở dữ liệu chưa có nội dung, nên chạy lại không nạp trùng.
    command:
      - sh
      - -c
      - >-
        ./node_modules/.bin/prisma migrate deploy &&
        if [ -f prisma/public-library.json.gz ];
        then node scripts/import-public-content.cjs prisma/public-library.json.gz --if-empty;
        else node scripts/seed-demo-if-empty.cjs;
        fi
    depends_on:
      postgres: {condition: service_healthy}
  listening-model:
    build: {context: ., dockerfile: backend/Dockerfile}
    volumes: ["listening_models:/app/storage/models"]
    # Tải mô hình nhận dạng giọng nói cho Listening. Nếu không tải được, hệ thống vẫn chạy, chỉ tắt chức năng chép lời.
    command:
      - sh
      - -c
      - /opt/listening-asr/bin/python scripts/listening-asr.py prepare --model /app/storage/models/base.en || echo "Chua tai duoc mo hinh nhan dang giong noi, chuc nang chep loi Listening tam tat."
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    restart: unless-stopped
    volumes: ["listening_media:/app/storage/listening", "listening_models:/app/storage/models", "listening_asr_input:/app/storage/asr-input"]
    environment:
      NODE_ENV: production
      TRUST_PROXY: '1'
      DATABASE_URL: postgresql://${POSTGRES_USER:-toeic}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-toeic}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DAS3H_MODEL_PATH: ${DAS3H_MODEL_PATH-models/das3h-own-v1.json}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      READING_MAX_TEXT_CHARS: ${READING_MAX_TEXT_CHARS:-10000}
      READING_MAX_QUESTIONS: ${READING_MAX_QUESTIONS:-5}
      READING_GENERATIONS_PER_DAY: ${READING_GENERATIONS_PER_DAY:-5}
      READING_TUTOR_PER_DAY: ${READING_TUTOR_PER_DAY:-30}
      READING_TUTOR_MAX_CONTEXT_CHARS: ${READING_TUTOR_MAX_CONTEXT_CHARS:-12000}
      READING_AI_TIMEOUT_MS: ${READING_AI_TIMEOUT_MS:-45000}
      LISTENING_ASR_ENABLED: ${LISTENING_ASR_ENABLED:-true}
      # Mặc định gửi email qua Mailpit (hộp thư thử nghiệm tại http://localhost:8025). Đặt SMTP_* trong .env để gửi email thật.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-TOEIC Adaptive <no-reply@toeic-adaptive.local>}
      # Khi có SMTP_USER mà thiếu SMTP_PASS (bản lấy từ GitHub), mã được gửi vào Mailpit.
      SMTP_FALLBACK_HOST: ${SMTP_FALLBACK_HOST-mailpit}
      SMTP_FALLBACK_PORT: ${SMTP_FALLBACK_PORT:-1025}
      OTP_DEV_LOG: ${OTP_DEV_LOG:-false}
      OTP_SECRET: ${OTP_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      listening-model: {condition: service_completed_successfully}
      mailpit: {condition: service_started}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    restart: unless-stopped
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
  redis_data:
  listening_media:
  listening_models:
  listening_asr_input:
