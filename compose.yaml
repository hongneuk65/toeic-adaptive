services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toeic}
      POSTGRES_USER: ${POSTGRES_USER:-toeic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-toeic}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-toeic}?schema=public
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      postgres: {condition: service_healthy}
  listening-model:
    build: {context: ., dockerfile: backend/Dockerfile}
    volumes: ["listening_models:/app/storage/models"]
    command: ["/opt/listening-asr/bin/python", "scripts/listening-asr.py", "prepare", "--model", "/app/storage/models/base.en"]
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    restart: unless-stopped
    volumes: ["listening_media:/app/storage/listening", "listening_models:/app/storage/models", "listening_asr_input:/app/storage/asr-input"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-toeic}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-toeic}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      READING_MAX_TEXT_CHARS: ${READING_MAX_TEXT_CHARS:-10000}
      READING_MAX_QUESTIONS: ${READING_MAX_QUESTIONS:-5}
      READING_GENERATIONS_PER_DAY: ${READING_GENERATIONS_PER_DAY:-5}
      READING_TUTOR_PER_DAY: ${READING_TUTOR_PER_DAY:-30}
      READING_TUTOR_MAX_CONTEXT_CHARS: ${READING_TUTOR_MAX_CONTEXT_CHARS:-12000}
      READING_AI_TIMEOUT_MS: ${READING_AI_TIMEOUT_MS:-45000}
      LISTENING_ASR_ENABLED: ${LISTENING_ASR_ENABLED:-true}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      listening-model: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    restart: unless-stopped
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
  redis_data:
  listening_media:
  listening_models:
  listening_asr_input:
