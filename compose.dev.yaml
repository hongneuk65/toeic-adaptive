# Mở cổng PostgreSQL và Redis ra máy để chạy backend/frontend bằng Node khi phát triển.
# Dùng: docker compose -f compose.yaml -f compose.dev.yaml up -d postgres redis
services:
  postgres:
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
  redis:
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"]
